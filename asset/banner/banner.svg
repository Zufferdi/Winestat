<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Le marché suisse du vin importé · 2025">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F2EDE4"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A63D47"/>
      <stop offset="100%" stop-color="#4A0F18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6C36A"/>
      <stop offset="100%" stop-color="#B47C36"/>
    </linearGradient>
    <radialGradient id="glassHilite" cx="0.35" cy="0.3" r="0.4">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#7A6F66" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- Decorative bottle silhouette on the right -->
  <g transform="translate(920, 32)" opacity="0.95">
    <!-- Bottle -->
    <path d="M 60 20 L 60 56 L 50 78 L 50 250 Q 50 268 68 268 L 110 268 Q 128 268 128 250 L 128 78 L 118 56 L 118 20 Z"
          fill="url(#wine)" stroke="#2C1810" stroke-width="1.2"/>
    <!-- Foil -->
    <rect x="58" y="20" width="62" height="42" fill="#4A0F18"/>
    <!-- Label -->
    <rect x="56" y="138" width="66" height="84" fill="#FAF7F2" stroke="#2C1810" stroke-width="0.8"/>
    <text x="89" y="166" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="#2C1810">Contingents</text>
    <text x="89" y="184" text-anchor="middle" font-family="serif" font-size="22" font-weight="700" fill="#722F37">2025</text>
    <text x="89" y="208" text-anchor="middle" font-family="sans-serif" font-size="7" letter-spacing="1" fill="#7A6F66">SUISSE · 2153 IMP.</text>
    <!-- Glass next to bottle -->
    <g transform="translate(-100, 84)">
      <!-- Bowl -->
      <path d="M 20 0 Q 20 80 70 80 Q 120 80 120 0 Z"
            fill="url(#wine)" stroke="#2C1810" stroke-width="1.2"/>
      <!-- Highlight -->
      <ellipse cx="60" cy="30" rx="22" ry="34" fill="url(#glassHilite)"/>
      <!-- Stem -->
      <rect x="68" y="78" width="4" height="80" fill="#2C1810"/>
      <!-- Foot -->
      <ellipse cx="70" cy="160" rx="34" ry="6" fill="#2C1810"/>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(56, 92)">
    <text x="0" y="0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11"
          font-weight="600" letter-spacing="3" fill="#722F37">DONNÉES OUVERTES · OFAG 2025</text>

    <text x="0" y="56" font-family="ui-serif, Georgia, serif" font-size="58"
          font-weight="700" fill="#2C1810" letter-spacing="-1">
      Le marché suisse
    </text>
    <text x="0" y="112" font-family="ui-serif, Georgia, serif" font-size="58"
          font-weight="400" font-style="italic" fill="#722F37" letter-spacing="-1">
      du vin importé
    </text>

    <text x="0" y="158" font-family="ui-serif, Georgia, serif" font-size="18"
          font-style="italic" fill="#7A6F66">
      2 153 importateurs · 127 millions de litres · 27 cantons
    </text>
  </g>

  <!-- Bottom rule -->
  <line x1="56" y1="288" x2="1144" y2="288" stroke="#2C1810" stroke-width="1"/>
  <text x="56" y="306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10"
        font-weight="500" letter-spacing="2" fill="#7A6F66">VISUALISATIONS · ANALYSES · DONNÉES BRUTES</text>
  <text x="1144" y="306" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="10" font-style="italic" fill="#7A6F66">github.com/your/wine-imports-ch</text>
</svg>
